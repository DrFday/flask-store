<!DOCTYPE html>
<html>
<head>
    <title>E-Book Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/static/css/style.css?v=1" rel="stylesheet">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-dark-subtle">

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/"><img src="static\images\logo.jpg" width="30" height="30" class="d-inline-block align-top" alt=""> Dr.Fday's E-Book Store</a>
  <div>
    {% if session.user %}
      <a href="/cart" class="btn btn-warning btn-sm">Cart</a>
      <a href="/history" class="btn btn-info btn-sm">History</a>
      <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    {% else %}
      <a href="/login" class="btn btn-success btn-sm">Login</a>
      <a href="/register" class="btn btn-primary btn-sm">Register</a>
    {% endif %}
  </div>
</nav>
 <div class="alert alert-primary d-flex align-items-center" role="alert">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-info-square-fill" viewBox="0 0 16 16">
  <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.93 4.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM8 5.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
</svg>
  <div>
    <strong> EN</strong> this
  </div>
</div>
<div class="alert alert-primary d-flex align-items-center" role="alert">
  <p align="right"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-info-square-fill" viewBox="0 0 16 16">
  <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.93 4.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM8 5.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
</svg>
  <div>
    <strong> FA</strong> این
  </div></p>
</div>
{% block content %}{% endblock %}

<footer class="text-center mt-5 p-3 bg-dark-subtle">
  Dr.Fday's School Project – Flask E-Book Store <br/> <a href="https://github.com/DrFday/flask-store" target="_blank">Github Link</a>
</footer>

</body>
</html>
